# --- General ---
set-option -g prefix C-b
bind-key C-b send-prefix

set -g mouse on
set -g allow-passthrough on

# Number windows/panes from 1 and keep them contiguous
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Don't wait after Escape (helps vim/neovim)
set -sg escape-time 0

# Larger scrollback history
set -g history-limit 50000

# --- Windows & panes ---
# Open new splits/windows in the current directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Mnemonic split bindings (| vertical, - horizontal)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate windows left/right
bind-key -r S-Left previous-window
bind-key -r S-Right next-window

# Move the current window left/right
bind-key < swap-window -t -1 \; previous-window
bind-key > swap-window -t +1 \; next-window

# --- Clipboard ---
# Sync copy-mode selections with the system clipboard
set -g set-clipboard on
if-shell "uname | grep -q Darwin" {
    bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy"
    bind-key -T copy-mode y send-keys -X copy-pipe-and-cancel "pbcopy"
    bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy"
} {
    bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "xclip -selection clipboard -i"
    bind-key -T copy-mode y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
    bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe "xclip -selection clipboard -i"
}
