name: Unix setup CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  setup-unix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install base system (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            cinnamon

      - name: Install base system (macOS)
        if: runner.os == 'macOS'
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          brew install bash git
          export PATH="/opt/homebrew/bin:$PATH"
            
      - name: Setup test (Linux)
        if: runner.os == 'Linux'
        shell: bash -il {0}
        run: ./setup-cinnamon.sh

      - name: Setup test (macOS)
        if: runner.os == 'macOS'
        shell: bash -il {0}
        run: ./setup-macos.sh

      - name: .bashrc test (Linux)
        if: runner.os == 'Linux'
        shell: bash -il {0}
        run: |
          ./setup-cinnamon.sh
          source ~/.bashrc
          alias emacs-agenda >/dev/null 2>&1

      - name: .bashrc test (macOS)
        if: runner.os == 'macOS'
        shell: bash -il {0}
        run: |
          ./setup-macos.sh
          source ~/.bashrc
          alias emacs-agenda >/dev/null 2>&1

      - name: .gitconfig test
        shell: bash -il {0}
        run: |
          ./setup.sh
          REBASE_ACTUAL="$(git config --global pull.rebase || true)"
          if [[ "$REBASE_ACTUAL" != "true" ]]; then
            exit 1
          fi
