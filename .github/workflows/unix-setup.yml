name: Unix setup CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  setup-unix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select setup script
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            echo "SETUP_SCRIPT=./setup-cinnamon.sh" >> "$GITHUB_ENV"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "SETUP_SCRIPT=./setup-macos.sh" >> "$GITHUB_ENV"
          fi

      - name: Install base system
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y git cinnamon
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            brew install bash git tmux
            export PATH="/opt/homebrew/bin:$PATH"
          fi

      - name: Setup test
        shell: bash -il {0}
        run: $SETUP_SCRIPT

      - name: .bashrc test
        shell: bash -il {0}
        run: |
          $SETUP_SCRIPT
          source ~/.bashrc
          alias emacs-agenda >/dev/null 2>&1

      - name: .gitconfig test
        shell: bash -il {0}
        run: |
          $SETUP_SCRIPT
          REBASE_ACTUAL="$(git config --global pull.rebase || true)"
          if [[ "$REBASE_ACTUAL" != "true" ]]; then
            exit 1
          fi

      - name: .tmux.conf test
        shell: bash -il {0}
        run: |
          $SETUP_SCRIPT
          tmux -f ~/.tmux.conf new-session -d -s test
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            tmux -f ~/.tmux.conf list-keys -T copy-mode-vi | grep -q "pbcopy"
          else
            tmux -f ~/.tmux.conf list-keys -T copy-mode-vi | grep -q "xclip"
          fi
          tmux kill-session -t test
