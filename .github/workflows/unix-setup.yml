name: Unix setup CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  setup-unix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install base system
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y git cinnamon
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            brew install bash git
            export PATH="/opt/homebrew/bin:$PATH"
          fi

      - name: Setup test
        shell: bash -il {0}
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            ./setup-cinnamon.sh
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            ./setup-macos.sh
          fi

      - name: .bashrc test
        shell: bash -il {0}
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            ./setup-cinnamon.sh
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            ./setup-macos.sh
          fi
          source ~/.bashrc
          alias emacs-agenda >/dev/null 2>&1

      - name: .gitconfig test
        shell: bash -il {0}
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            ./setup-cinnamon.sh
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            ./setup-macos.sh
          fi
          REBASE_ACTUAL="$(git config --global pull.rebase || true)"
          if [[ "$REBASE_ACTUAL" != "true" ]]; then
            exit 1
          fi
